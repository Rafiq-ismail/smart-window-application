name: smart_window
description: Smart Window IoT System
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  another_flushbar: ^1.12.30

  cupertino_icons: ^1.0.8

  pdf: ^3.11.3
  printing: ^5.14.2

  # Charts
  fl_chart: ^1.0.0

  # Date & Time Formatting
  intl: ^0.20.2

  # SVG Icons
  flutter_svg: ^2.2.1

  # Beautiful Animations
  lottie: ^3.3.2

  # State Management
  provider: ^6.1.5

  # Shared Preferences (Save Settings)
  shared_preferences: ^2.5.3

  # HTTP API (Future ESP32 / Weather API)
  http: ^1.5.0

  # Connectivity Detection
  connectivity_plus: ^7.0.0

  # Network Information
  network_info_plus: ^6.1.4

  # Icons
  font_awesome_flutter: ^10.10.0

  # Loading Animation
  flutter_spinkit: ^5.2.2
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
